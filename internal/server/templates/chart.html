<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{.Title}}: {{.OldRef}} → {{.NewRef}}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>{{.CSS}}</style>
</head>
<body>
  <h1>
    {{if .ConsoleURL}}<a class="repo" href="{{.ConsoleURL}}" target="_blank" rel="noopener">{{.Title}}<span class="ext-arrow" aria-hidden="true">↗</span></a>{{else}}<span class="repo">{{.Title}}</span>{{end}}:
    <span class="ref from">{{.OldRef}}</span>
    <span class="arrow">→</span>
    <span class="ref to">{{.NewRef}}</span>
  </h1>

  <div id="loading"><span class="spinner"></span>Computing diff…</div>
  <div id="error" class="error" hidden></div>

  <div id="content" hidden>
    <div id="ref-meta" class="apk-meta"></div>

    <details class="diff-section" id="images-section" open hidden>
      <summary>Images</summary>
      <div id="images"></div>
    </details>

    <details class="diff-section" open>
      <summary>Chart.yaml</summary>
      <div id="chart-yaml"></div>
    </details>

    <details class="diff-section" open>
      <summary>values.yaml</summary>
      <div id="values"></div>
    </details>
  </div>

  <script>
    const apiPrefix = {{.APIPrefix}};
    const chartName = {{.Name}};
    const oldRef = {{.OldRef}};
    const newRef = {{.NewRef}};
  </script>
  <script>{{.CommonJS}}</script>
  <script>{{.JS}}</script>
</body>
</html>
