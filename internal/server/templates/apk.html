<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{if eq .FromName .ToName}}{{.FromName}}: {{.From}} → {{.To}}{{else}}{{.FromName}} {{.From}} → {{.ToName}} {{.To}}{{end}}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>{{.CSS}}</style>
</head>
<body>
  <h1>
    {{if eq .FromName .ToName}}
      <span class="repo">{{.FromName}}</span>:
      <a class="ref from" href="{{.FromURL}}">{{.From}}</a>
      <span class="arrow">→</span>
      <a class="ref to" href="{{.ToURL}}">{{.To}}</a>
    {{else}}
      <a class="ref from" href="{{.FromURL}}"><span class="repo">{{.FromName}}</span> {{.From}}</a>
      <span class="arrow">→</span>
      <a class="ref to" href="{{.ToURL}}"><span class="repo">{{.ToName}}</span> {{.To}}</a>
    {{end}}
  </h1>

  <div id="loading"><span class="spinner"></span>Loading apk diff…</div>
  <div id="error" class="error" hidden></div>

  <div id="content" hidden>
    <div id="apk-meta" class="apk-meta"></div>
    <details class="diff-section" open>
      <summary>Sources</summary>
      <div id="sources"></div>
    </details>

    <details class="diff-section" open>
      <summary>.melange.yaml</summary>
      <div id="melange"></div>
    </details>

    <details class="diff-section" open>
      <summary>.PKGINFO</summary>
      <div id="pkginfo"></div>
    </details>
  </div>

  <script>
    const apiURL = {{.APIURL}};
    const fromVer = {{.From}};
    const toVer = {{.To}};
  </script>
  <script>{{.CommonJS}}</script>
  <script>{{.JS}}</script>
</body>
</html>
