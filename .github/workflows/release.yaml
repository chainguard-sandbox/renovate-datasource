name: Release

on:
  schedule:
    - cron: "0 0 * * 1" # every Monday at 00:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    permissions:
      id-token: write # octo-sts federation

    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            cafe.github.com:443
            github.com:443
            octo-sts.dev:443

      - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: octo-sts
        with:
          scope: ${{ github.repository }}
          identity: release

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.octo-sts.outputs.token }}
          persist-credentials: false
          # Full history + tags at clone time so subsequent steps don't
          # need to re-fetch (which would fail on a private repo since
          # persist-credentials: false strips the auth token). The tag
          # action below also needs the commit history to derive the
          # semver bump.
          fetch-depth: 0
          fetch-tags: true

      - name: Check if any changes since last release
        id: check
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: |
          TAG=$(git tag --points-at HEAD)
          if [ -z "$TAG" ]; then
            echo "No tag points at HEAD, so we need a new tag and then a new release."
            echo "need_release=yes" >> "$GITHUB_OUTPUT"
          else
            RELEASE=$(gh release view "$TAG" --json tagName --jq '.tagName' || echo "none")
            if [ "$RELEASE" == "$TAG" ]; then
              echo "A release exists for tag $TAG, which has the latest changes, so no need for a new tag or release."
              echo "need_release=no" >> "$GITHUB_OUTPUT"
            else
              echo "Tag $TAG exists, but no release is associated. Need a new release."
              echo "need_release=yes" >> "$GITHUB_OUTPUT"
              echo "existing_tag=$TAG" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Bump version and push tag
        id: create_tag
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        if: steps.check.outputs.need_release == 'yes' && steps.check.outputs.existing_tag == ''
        with:
          github_token: ${{ steps.octo-sts.outputs.token }}

      - name: Create GitHub Release
        if: steps.check.outputs.need_release == 'yes'
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          TAG: ${{ steps.check.outputs.existing_tag || steps.create_tag.outputs.new_tag }}
        run: gh release create "$TAG" --generate-notes --title "$TAG"
