# Tag and release the repo from the release workflow (scheduled +
# workflow_dispatch on main).
issuer: https://token.actions.githubusercontent.com
subject: repo:chainguard-sandbox/renovate-datasource:ref:refs/heads/main
claim_pattern:
  job_workflow_ref: chainguard-sandbox/renovate-datasource/.github/workflows/release.yaml@refs/heads/main
permissions:
  contents: write
